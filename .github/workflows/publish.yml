name: Publish to npm

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    if: github.repository == 'shbernal/ankimd'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      # In dependency order: the CLI's manifest names a version of the library,
      # so a registry that does not have it yet would reject the second publish.
      - name: Publish @ankimd/core
        run: pnpm --filter @ankimd/core publish --no-git-checks --access public

      - name: Publish @ankimd/cli
        run: pnpm --filter @ankimd/cli publish --no-git-checks --access public

      # The unscoped name, last: it is a pointer at the CLI and nothing else.
      - name: Publish ankimd
        run: pnpm --filter ankimd publish --no-git-checks --access public
