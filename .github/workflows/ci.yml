name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Check prose
        run: pnpm run prose

      # The suites run against src/, so nothing above proves the exports maps
      # and the emitted extensions resolve. This does, against the built output.
      # `@ankimd/core` is resolved from `cli/`, where pnpm links it, because that
      # is the path a consumer actually takes.
      - name: Smoke-test the built packages
        working-directory: cli
        run: |
          node --input-type=module -e "import('@ankimd/core')"
          node dist/index.js

      - name: Verify package contents
        run: |
          pnpm --filter @ankimd/core exec npm pack --dry-run --ignore-scripts
          pnpm --filter @ankimd/cli exec npm pack --dry-run --ignore-scripts
